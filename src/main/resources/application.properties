# Server Configuration
server.port=8080

# Spring Configuration
spring.application.name=text-to-image-gen

# Database Configuration (H2 File-based persistent SQL database)
# Persists all generated images and history across restarts to ./data/imagedb.mv.db
spring.datasource.url=jdbc:h2:file:./data/imagedb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Spring Data JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Database Web Console (Accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Logging
logging.level.com.imageng=INFO
logging.level.org.springframework.web=INFO

# Optional AI API Keys (fallback uses zero-key smart multi-engine)
# LOVABLE_API_KEY=
# OPENAI_API_KEY=
